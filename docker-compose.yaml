services:
  postgres:
    image: postgres:16-alpine
    container_name: gcp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gcpdb}
      POSTGRES_USER: ${POSTGRES_USER:-gcp_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gcp_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gcp_admin} -d ${POSTGRES_DB:-gcpdb}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7.0
    container_name: gcp-mongodb
    restart: unless-stopped
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-gcpdb}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [ "CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gcp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx768m -Xms256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gcpdb}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-gcp_admin}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-gcp_password}
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/${MONGO_DB:-gcpdb}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8081}:8081"


volumes:
  postgres_data:
    name: gcp_postgres_data
  mongo_data:
    name: gcp_mongo_data

