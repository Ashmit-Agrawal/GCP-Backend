spring:
  application:
    name: gcp-backend
  profiles:
    default: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:gcpdb}}
    username: ${SPRING_DATASOURCE_USERNAME:gcp_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:gcp_password}
    driver-class-name: org.postgresql.Driver

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:gcpdb}}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${SERVER_PORT:8081}

# Frontend (Vite dev server). Comma-separate to allow more origins.
gcp:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Loads demo parcels and seed users on startup (disabled in base config; enabled in dev profile)
  seed-demo-data: ${GCP_SEED_DEMO_DATA:false}

# JWT Configuration (Secret must be provided via environment variable or dev profile)
jwt:
  secret: ${JWT_SECRET:}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
