spring:
  application:
    name: gcp-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:gcpdb}}
    username: ${SPRING_DATASOURCE_USERNAME:gcp_admin}
    password: ${SPRING_DATASOURCE_PASSWORD:gcp_password}
    driver-class-name: org.postgresql.Driver

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:gcpdb}}

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# Frontend (Vite dev server). Comma-separate to allow more origins.
gcp:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  # Loads demo parcels and seed users on startup
  seed-demo-data: true

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:9a3f2c4e6b8a1d0f5e7c3b2a1f4e6d8c0b2a4e6f8a1c3e5d7b9a0c2e4f6a8b1d}
  expiration-ms: 86400000
